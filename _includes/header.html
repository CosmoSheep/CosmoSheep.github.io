<div id="particles-js">
  <div class="content">
    <div class="author">
        <div class="author_image">
          <img src="{{site.baseurl}}/assets/img/{% if site.author-pic %}{{site.author-pic}}{% endif %}" style="border-radius:50%;" alt="Author image">
        </div>
        <div class="author_info">
          <h1 class="author_title">{% if site.username %}{{site.username}}{% else %}Heyang Long{% endif %}</h1>
        </div>
        <div class="author_info">
          <p class="author_description">{% if site.user_description %}{{site.user_description}}{% else %} {% endif %}</p>
        </div>
    </div>
<!--      <a class="link" href="/blog" >Blog</a>  -->
      <!-- <a class="link" href="#research" >Research</a> -->
      <a class="link" target="_blank" href="/gallery" >Gallery</a>
      <!-- <a class="link" target="_blank" href="/assets/file/CV_HeyangLong.pdf" >CV</a> -->
        <div class="icons-header">
          <a aria-label="Send email" href="mailto:{{site.email}}" title="Send me an email"><i class="icon fa fa-envelope"></i></a>
          <a aria-label="My Github" target="_blank" href="https://github.com/{{site.github_username}}" title="Github"><i class="icon fa fa-github-alt" aria-hidden="true"></i></a>
          <a aria-label="LinkedIn" href="https://www.linkedin.com/in/heyang-long-396441263" target="_blank" title="Visit my LinkedIn"><i class="icon fa fa-linkedin"></i></a>
          <a aria-label="Instagram" href="https://www.instagram.com/newtanc" target="_blank" title="Instagram"><i class="icon fa fa-instagram"></i></a>
        </div>

</div>
